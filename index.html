<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#F1F3F2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#171B1F" media="(prefers-color-scheme: dark)">
<title>Japan Honeymoon Handbook</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⛩️</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@600;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root {
  color-scheme: light;
  --bg:#F1F3F2; --surface:#FBFCFB; --surface-2:#F5F7F6; --text:#2A2F33; --muted:#66707A; --line:#DDE2E0;
  --plan:#3E5C8A; --plan-tint:#E7EDF6;
  --tokyo:#A85A4A; --tokyo-tint:#F5E9E5;
  --kyoto:#58764F; --kyoto-tint:#E8EFE4;
  --okinawa:#2A8087; --okinawa-tint:#E0F0F0;
  --travel:#7A7F86; --travel-tint:#ECEEEF;
  --ok:#3F7A52; --ok-tint:#E4F1E7; --todo:#9A6B1F; --todo-tint:#F7EEDC;
  --danger:#A6443A;
  --serif:"Shippori Mincho","Hiragino Mincho ProN","Yu Mincho",Georgia,serif;
  --sans:"Zen Kaku Gothic New","Hiragino Sans","Segoe UI",system-ui,-apple-system,sans-serif;
  --radius:12px; --tabh:64px;
}
@media (prefers-color-scheme: dark) {
  :root {
    color-scheme: dark;
    --bg:#171B1F; --surface:#1F2428; --surface-2:#252B30; --text:#E3E5E3; --muted:#A1A9B0; --line:#323A40;
    --plan:#9CB4DA; --plan-tint:#243041;
    --tokyo:#E0998A; --tokyo-tint:#3A2925;
    --kyoto:#A7C49C; --kyoto-tint:#273326;
    --okinawa:#7CC9CD; --okinawa-tint:#1E3436;
    --travel:#AEB3B8; --travel-tint:#2A2F33;
    --ok:#8CC79C; --ok-tint:#22352A; --todo:#E0B46A; --todo-tint:#3A3020;
    --danger:#E58C82;
  }
}
* { box-sizing:border-box; }
html { -webkit-text-size-adjust:100%; }
body { margin:0; background:var(--bg); color:var(--text); font:400 16px/1.55 var(--sans); }
button, input, select, textarea { font:inherit; color:inherit; }
a { color:var(--plan); }
:focus-visible { outline:2px solid var(--plan); outline-offset:2px; border-radius:6px; }
.wrap { max-width:880px; margin:0 auto; padding:0 20px; }

/* Header */
header.top { padding:calc(22px + env(safe-area-inset-top,0px)) 0 14px; }
header.top .wrap { display:flex; align-items:flex-end; justify-content:space-between; gap:16px; flex-wrap:wrap; }
header.top h1 { font:700 clamp(1.6rem,4.5vw,2.3rem)/1.15 var(--serif); margin:0; }
header.top .sub { color:var(--muted); font-size:.95rem; margin-top:4px; }
.countdown { font-size:.95rem; color:var(--muted); text-align:right; }
.countdown strong { display:block; font:700 1.5rem/1.1 var(--serif); color:var(--text); }

/* Tabs */
nav.tabs { position:sticky; top:0; z-index:20; background:var(--bg); border-bottom:1px solid var(--line); }
nav.tabs .wrap { display:flex; gap:2px; }
nav.tabs button { flex:1; background:none; border:0; padding:12px 6px 11px; color:var(--muted); cursor:pointer;
  display:flex; flex-direction:column; align-items:center; gap:3px; font-size:.86rem; border-bottom:3px solid transparent; }
nav.tabs button svg { width:20px; height:20px; }
nav.tabs button[aria-current="page"] { color:var(--plan); border-bottom-color:var(--plan); font-weight:700; }
nav.tabs button:hover { color:var(--text); }
@media (max-width:700px) {
  nav.tabs { position:fixed; top:auto; bottom:0; left:0; right:0; border-bottom:0; border-top:1px solid var(--line);
    padding-bottom:env(safe-area-inset-bottom,0px); background:var(--surface); }
  nav.tabs .wrap { padding:0 4px; }
  nav.tabs button { font-size:.72rem; padding:8px 2px 6px; border-bottom:0; border-top:3px solid transparent; }
  nav.tabs button[aria-current="page"] { border-top-color:var(--plan); }
}

/* main also has .wrap, whose padding shorthand would otherwise win and remove this spacing */
main.wrap { padding-top:28px; padding-bottom:64px; }
@media (max-width:700px) {
  main.wrap { padding-top:16px; padding-bottom:calc(var(--tabh) + 32px + env(safe-area-inset-bottom,0px)); }
}
section.view { display:none; }
section.view.on { display:block; }
h2 { font:700 1.55rem/1.25 var(--serif); margin:8px 0 6px; }
h3 { font:700 1.2rem/1.3 var(--serif); margin:28px 0 10px; }
.lead { color:var(--muted); margin:0 0 18px; max-width:64ch; }
.card { background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:16px 18px; }
.stack > * + * { margin-top:12px; }
.btn { display:inline-flex; align-items:center; gap:6px; border:1px solid var(--line); background:var(--surface); border-radius:999px;
  padding:7px 14px; cursor:pointer; font-size:.9rem; text-decoration:none; color:var(--text); }
.btn:hover { border-color:var(--muted); }
.btn.primary { background:var(--plan); border-color:var(--plan); color:var(--surface); font-weight:700; }
.btn.small { padding:4px 11px; font-size:.84rem; }
.btn.danger { color:var(--danger); }
.row { display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
.spacer { flex:1; }
.muted { color:var(--muted); }

/* Route */
.route { margin:4px 0 26px; }
.route .bar { display:flex; gap:4px; height:12px; }
.route .bar span { border-radius:6px; }
.route .legs { display:flex; gap:4px; margin-top:8px; }
.route .legs a { text-decoration:none; color:var(--text); font-size:.88rem; line-height:1.35; min-width:0; }
.route .legs strong { display:block; font:700 1.05rem/1.3 var(--serif); }
.route .legs span { color:var(--muted); }

/* City groups and day cards */
.city-head { display:flex; align-items:baseline; gap:4px 10px; margin:26px 0 10px; flex-wrap:wrap; }
.city-head .dot { align-self:center; }
.city-head .dot { width:12px; height:12px; border-radius:50%; flex:none; }
.city-head h3 { margin:0; }
.city-head .muted { font-size:.9rem; }
.day { display:grid; grid-template-columns:64px 1fr; gap:14px; background:var(--surface); border:1px solid var(--line);
  border-left:5px solid var(--c); border-radius:var(--radius); padding:14px 16px; }
.day + .day { margin-top:10px; }
.day .date { text-align:center; line-height:1.1; padding-top:2px; }
.day .date b { display:block; font:700 1.7rem/1 var(--serif); }
.day .date small { color:var(--muted); font-size:.8rem; }
.day h4 { margin:0 0 6px; font-size:1.05rem; }
.day .slot { display:grid; grid-template-columns:70px 1fr; gap:8px; font-size:.95rem; line-height:1.45; }
.day .slot + .slot { margin-top:4px; }
.day .slot span:first-child { color:var(--muted); font-size:.85rem; padding-top:1px; }
.day .extras { display:flex; flex-wrap:wrap; gap:6px; margin-top:10px; }
.chip { display:inline-flex; align-items:center; gap:5px; font-size:.82rem; padding:3px 10px; border-radius:999px;
  background:var(--tint); color:var(--text); border:0; cursor:pointer; text-decoration:none; }
.chip.ok { background:var(--ok-tint); }
.chip.todo { background:var(--todo-tint); }
.chip .st { font-weight:700; }
.chip.ok .st { color:var(--ok); } .chip.todo .st { color:var(--todo); }
.day.today { box-shadow:0 0 0 2px var(--c); }
.today-tag { font-size:.75rem; font-weight:700; color:var(--c); }

/* Places */
.seg { display:inline-flex; gap:2px; background:var(--surface-2); border:1px solid var(--line); border-radius:999px; padding:4px; margin-bottom:20px; }
.seg button { border:0; background:none; min-height:36px; padding:6px 18px; border-radius:999px; cursor:pointer; color:var(--muted); line-height:1.2; }
.seg button:hover { color:var(--text); }
.seg button[aria-pressed="true"] { background:var(--c); color:var(--surface); font-weight:700; }
.place-hero img { display:block; width:100%; height:auto; border-radius:var(--radius); }
.place-hero { margin-bottom:16px; }
.hotel { border-left:5px solid var(--c); }
.hotel .label { font-size:.85rem; color:var(--muted); }
.hotel h4 { margin:2px 0 4px; font:700 1.15rem/1.3 var(--serif); }
.sights { display:grid; grid-template-columns:repeat(auto-fill,minmax(250px,1fr)); gap:12px; }
.sight { background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:14px 16px; scroll-margin-top:90px; }
.sight.flash { box-shadow:0 0 0 2px var(--c); }
.sight h4 { margin:0 0 4px; font-size:1.02rem; }
.sight .when { font-size:.8rem; color:var(--c); font-weight:700; }
.sight p { margin:0 0 8px; font-size:.93rem; line-height:1.5; }
.sight dl { margin:0; display:grid; grid-template-columns:auto 1fr; gap:2px 10px; font-size:.86rem; }
.sight dt { color:var(--muted); }
.sight dd { margin:0; }
ul.plain { list-style:none; padding:0; margin:0; }
ul.plain li { padding:10px 0; border-top:1px solid var(--line); }
ul.plain li:first-child { border-top:0; }

/* Bookings */
.summary { display:flex; gap:12px; flex-wrap:wrap; margin-bottom:16px; }
.summary .card { flex:1; min-width:140px; padding:12px 16px; }
.summary b { display:block; font:700 1.5rem/1.1 var(--serif); }
.filters { display:flex; gap:6px; flex-wrap:wrap; margin:0 0 14px; }
.filters button { border:1px solid var(--line); background:var(--surface); border-radius:999px; padding:4px 12px; cursor:pointer; font-size:.86rem; color:var(--muted); }
.filters button[aria-pressed="true"] { background:var(--plan-tint); color:var(--plan); border-color:var(--plan); font-weight:700; }
.bk { background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:14px 16px; }
.bk + .bk { margin-top:10px; }
.bk.todo { border-style:dashed; }
.bk .head { display:flex; gap:10px; align-items:flex-start; }
.bk h4 { margin:0; font-size:1rem; }
.bk .meta { font-size:.86rem; color:var(--muted); }
.badge { font-size:.75rem; font-weight:700; padding:2px 9px; border-radius:999px; white-space:nowrap; }
.badge.ok { background:var(--ok-tint); color:var(--ok); } .badge.todo { background:var(--todo-tint); color:var(--todo); }
.bk .conf { margin-top:8px; font-size:.95rem; }
.bk .conf b { letter-spacing:.04em; }
.bk .notes { margin-top:8px; white-space:pre-wrap; font-size:.9rem; background:var(--surface-2); border-radius:8px; padding:10px 12px; max-height:220px; overflow:auto; overflow-wrap:anywhere; }
.bk .actions { margin-top:10px; display:flex; gap:8px; flex-wrap:wrap; }
.bk.flash { box-shadow:0 0 0 2px var(--plan); }
.backup { margin-top:28px; }

/* Checklist */
.progress { height:8px; background:var(--surface-2); border-radius:4px; overflow:hidden; margin:6px 0 20px; border:1px solid var(--line); }
.progress span { display:block; height:100%; background:var(--ok); width:0; transition:width .3s; }
@media (prefers-reduced-motion: reduce) { .progress span { transition:none; } }
.check { display:flex; gap:12px; align-items:flex-start; padding:10px 0; border-top:1px solid var(--line); cursor:pointer; line-height:1.45; }
.check:first-child { padding-top:2px; }
.check:last-child { padding-bottom:2px; }
.check:first-of-type { border-top:0; }
.check input { width:20px; height:20px; margin:1px 0 0; flex:none; accent-color:var(--ok); }
.check input:checked + span { color:var(--muted); text-decoration:line-through; }
.group-count { font-size:.85rem; color:var(--muted); font-weight:400; font-family:var(--sans); margin-left:8px; }

/* Tables */
.tbl { overflow-x:auto; -webkit-overflow-scrolling:touch; background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); }
table { border-collapse:collapse; width:100%; min-width:540px; font-size:.92rem; line-height:1.5; }
th { text-align:left; font-weight:700; color:var(--muted); font-size:.82rem; padding:10px 12px; border-bottom:1px solid var(--line); background:var(--surface-2); }
td { padding:10px 12px; vertical-align:top; border-top:1px solid var(--line); }
tr:first-child td { border-top:0; }
td.num, th.num { text-align:right; font-variant-numeric:tabular-nums; white-space:nowrap; }
td input.actual { width:96px; text-align:right; padding:5px 8px; border:1px solid var(--line); border-radius:8px; background:var(--surface-2); font-variant-numeric:tabular-nums; }
tfoot td { font-weight:700; border-top:2px solid var(--line); background:var(--surface-2); }
td .bnote { display:none; }
@media (max-width:700px) {
  /* Budget: fold the notes under each item instead of hiding them off to the side */
  table.budget { min-width:0; }
  table.budget .notes-col { display:none; }
  table.budget td .bnote { display:block; font-size:.8rem; font-weight:400; color:var(--muted); margin-top:2px; line-height:1.4; }
  table.budget td, table.budget th { padding:10px; }
  table.budget td input.actual { width:84px; }
  /* Info tables: one card-like block per row, each value labelled */
  .tbl.stack table { min-width:0; }
  .tbl.stack thead { display:none; }
  .tbl.stack tr, .tbl.stack td { display:block; }
  .tbl.stack tr { padding:12px 14px; border-top:1px solid var(--line); }
  .tbl.stack tr:first-child { border-top:0; }
  .tbl.stack td { padding:1px 0; border:0; }
  .tbl.stack td:first-child { font-weight:700; margin-bottom:2px; }
  .tbl.stack td + td { display:grid; grid-template-columns:104px 1fr; gap:8px; }
  .tbl.stack td + td::before { content:attr(data-label); color:var(--muted); font-size:.82rem; padding-top:1px; }
}

/* Dialog */
dialog { border:1px solid var(--line); border-radius:16px; padding:0; width:min(560px,calc(100vw - 24px)); background:var(--surface); color:var(--text); max-height:calc(100vh - 32px); }
dialog::backdrop { background:rgba(20,24,28,.45); }
dialog form { padding:20px; }
dialog h3 { margin:0 0 14px; }
.field { display:block; margin-bottom:12px; }
.field > span { display:block; font-size:.85rem; color:var(--muted); margin-bottom:4px; }
.field input, .field select, .field textarea { width:100%; padding:9px 11px; border:1px solid var(--line); border-radius:10px; background:var(--surface-2); }
.field textarea { min-height:120px; resize:vertical; }
.two { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.hint { font-size:.8rem; color:var(--muted); margin-top:4px; }
.toggle { display:flex; gap:10px; align-items:center; margin:4px 0 14px; cursor:pointer; }
.toggle input { width:20px; height:20px; accent-color:var(--ok); }
/* Keep Cancel and Save in view while the form scrolls */
.dlg-actions { position:sticky; bottom:0; background:var(--surface); margin:0 -20px -20px; padding:12px 20px 20px; border-top:1px solid var(--line); }
.toast { position:fixed; left:50%; transform:translateX(-50%); bottom:calc(24px + env(safe-area-inset-bottom,0px)); background:var(--text); color:var(--bg);
  padding:9px 16px; border-radius:999px; font-size:.9rem; opacity:0; pointer-events:none; transition:opacity .2s; z-index:50; }
.toast.show { opacity:1; }
@media (max-width:700px) { .countdown { text-align:left; } .countdown strong { display:inline; font-size:1.05rem; margin-right:6px; } .city-head .muted { flex-basis:100%; padding-left:22px; } .toast { bottom:calc(var(--tabh) + 16px + env(safe-area-inset-bottom,0px)); } .two { grid-template-columns:1fr; } .day { grid-template-columns:48px 1fr; gap:10px; padding:12px; } .day .slot { grid-template-columns:1fr; gap:0; } }
/* Bigger tap targets on phones and touch screens */
@media (max-width:700px), (pointer:coarse) {
  .chip { min-height:32px; padding:4px 12px; }
  .filters button { min-height:36px; padding:6px 14px; }
  .btn { min-height:40px; }
  .btn.small { min-height:36px; padding:6px 13px; }
  ul.plain li > a:only-child { display:block; margin:-10px 0; padding:10px 0; }
  .field textarea { min-height:96px; }
}
.info-block + .info-block { margin-top:30px; }
.tips p { margin:0 0 10px; }
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <div>
      <h1>Japan Honeymoon</h1>
      <div class="sub">June 18 – July 1, 2027 · Tokyo, Kyoto, Okinawa</div>
    </div>
    <div class="countdown" id="countdown"></div>
  </div>
</header>

<nav class="tabs" aria-label="Sections">
  <div class="wrap" id="tabbar"></div>
</nav>

<main class="wrap">
  <section class="view" id="v-trip"></section>
  <section class="view" id="v-places"></section>
  <section class="view" id="v-bookings"></section>
  <section class="view" id="v-checklist"></section>
  <section class="view" id="v-budget"></section>
  <section class="view" id="v-info"></section>
</main>

<dialog id="dlg">
  <form method="dialog" id="bkform">
    <h3 id="dlg-title">Booking</h3>
    <label class="field"><span>What is it?</span><input name="title" required placeholder="e.g. Shinkansen Tokyo → Kyoto"></label>
    <div class="two">
      <label class="field"><span>Type</span><select name="cat"></select></label>
      <label class="field"><span>Date</span><input name="date" type="date" min="2026-01-01" max="2027-12-31"></label>
    </div>
    <div class="two">
      <label class="field"><span>Time</span><input name="time" placeholder="e.g. 09:33"></label>
      <label class="field"><span>Confirmation or booking number</span><input name="conf" autocomplete="off"></label>
    </div>
    <label class="field"><span>Link</span><input name="link" type="url" placeholder="https://… booking page, ticket or e-mail link"></label>
    <label class="field"><span>Details</span><textarea name="notes" placeholder="Paste the confirmation e-mail, ticket text, address, seat numbers…"></textarea>
      <div class="hint">If you leave Link empty, the first web address in the details is used.</div></label>
    <label class="toggle"><input type="checkbox" name="booked"> Booked and confirmed</label>
    <div class="row dlg-actions">
      <button type="button" class="btn danger small" id="dlg-del">Delete</button>
      <span class="spacer"></span>
      <button type="button" class="btn" id="dlg-cancel">Cancel</button>
      <button type="submit" class="btn primary" value="save">Save</button>
    </div>
  </form>
</dialog>
<input type="file" id="importfile" accept="application/json,.json" hidden>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(function () {

  else el.innerHTML = '<strong>Welcome home</strong>';
}

/* ---------- Trip view ---------- */
function bookingsOn(date) { return state.bookings.filter(function (b) { return b.date === date; }); }
function renderTrip() {
  var t = todayStr(), html = '';
  html += '<h2>Your 14 days</h2><p class="lead">One or two essentials a day, done early, with the hot middle of the day left free. Tap a place for details, or a booking to see its confirmation.</p>';
  html += '<div class="route" aria-label="3 nights Tokyo, 5 nights Kyoto, 4 nights Okinawa"><div class="bar"><span style="flex:3;background:var(--tokyo)"></span><span style="flex:5;background:var(--kyoto)"></span><span style="flex:4;background:var(--okinawa)"></span></div>' +
    '<div class="legs"><a href="#tokyo" style="flex:3"><strong>Tokyo</strong><span>3 nights</span></a><a href="#kyoto" style="flex:5"><strong>Kyoto</strong><span>5 nights</span></a><a href="#okinawa" style="flex:4"><strong>Okinawa</strong><span>4 nights</span></a></div></div>';
  var last = '';
  DAYS.forEach(function (day) {
    var c = CITY[day.city];
    var groupKey = day.city === 'travel' ? 'travel-' + day.d : day.city;
    if (groupKey !== last) {
      if (day.city !== 'travel') html += '<div class="city-head"><span class="dot" style="background:' + c.c + '"></span><h3>' + c.name + '</h3><span class="muted">' + PLACES[day.city].dates + ' · ' + esc(PLACES[day.city].hotel.name) + '</span></div>';
      else html += '<div class="city-head"><span class="dot" style="background:' + c.c + '"></span><h3>Travel day</h3></div>';
      last = groupKey;
    }
    var d = parseD(day.d), isToday = day.d === t;
    html += '<article class="day' + (isToday ? ' today' : '') + '" id="day-' + day.d + '" style="--c:' + c.c + ';--tint:' + c.t + '">' +
      '<div class="date"><small>' + WD[d.getDay()] + '</small><b>' + d.getDate() + '</b><small>' + MO[d.getMonth()] + '</small></div><div>' +
      (isToday ? '<div class="today-tag">Today</div>' : '') +
      '<h4>' + esc(day.title) + '</h4>' +
      '<div class="slot"><span>Morning</span><span>' + esc(day.am) + '</span></div>' +
      '<div class="slot"><span>Later</span><span>' + esc(day.pm) + '</span></div><div class="extras">';
    day.see.forEach(function (id) { var f = sightById(id); if (f) html += '<a class="chip" href="#' + f.city + '" data-sight="' + id + '" data-city="' + f.city + '">' + esc(f.s.name) + '</a>'; });
    bookingsOn(day.d).forEach(function (b) {
      html += '<button type="button" class="chip ' + (b.booked ? 'ok' : 'todo') + '" data-bk="' + b.id + '"><span class="st">' + (b.booked ? '✓' : 'To book') + '</span>' + esc(b.title) + '</button>';
    });
    html += '<button type="button" class="chip" data-add="' + day.d + '" style="background:var(--surface-2)">+ Booking</button></div></div></article>';
  });
  $('#v-trip').innerHTML = html;
  if (t >= START && t <= END) { var el = document.getElementById('day-' + t); if (el && ROUTES[location.hash.slice(1)] === 'trip') el.scrollIntoView({ block: 'center' }); }
}
$('#v-trip').addEventListener('click', function (e) {
  var s = e.target.closest('[data-sight]'), b = e.target.closest('[data-bk]'), a = e.target.closest('[data-add]');
  if (s) { e.preventDefault(); go(s.dataset.city, 'sight-' + s.dataset.sight); }
  else if (b) go('bookings', 'bk-' + b.dataset.bk);
  else if (a) openDialog(null, a.dataset.add);
});

/* ---------- Places view ---------- */
function sightCard(s) {
  return '<div class="sight" id="sight-' + s.id + '"><div class="when">' + esc(s.when) + '</div><h4>' + esc(s.name) + '</h4><p>' + esc(s.why) + '</p>' +
    '<dl><dt>Cost</dt><dd>' + esc(s.cost) + '</dd><dt>Tip</dt><dd>' + esc(s.tip) + '</dd></dl></div>';
}
function renderPlaces() {
  var k = currentCity, p = PLACES[k], c = CITY[k], html = '';
  html += '<div class="seg" role="group" aria-label="City">';
  ['tokyo', 'kyoto', 'okinawa'].forEach(function (x) { html += '<button type="button" data-city="' + x + '" aria-pressed="' + (x === k) + '" style="--c:' + CITY[x].c + '">' + CITY[x].name + '</button>'; });
  html += '</div><div style="--c:' + c.c + ';--tint:' + c.t + '">';
  html += '<h2>' + c.name + '</h2><p class="lead">' + esc(p.dates) + '. ' + esc(p.intro) + '</p>';
  html += '<div class="place-hero"><img src="' + IMG[p.img] + '" alt="Illustration of ' + c.name + '" width="800" height="360"></div>';
  html += '<div class="card hotel"><div class="label">Where you’re staying</div><h4>' + esc(p.hotel.name) + '</h4><div>' + esc(p.hotel.note) + '</div><div class="muted" style="font-size:.9rem;margin-top:4px">' + esc(p.hotel.price) + '</div></div>';
  html += '<h3>Sights</h3><div class="sights">' + p.sights.map(sightCard).join('') + '</div>';
  if (p.daytrips) html += '<h3>' + (p.daytrips.length > 1 ? 'Day trips by train' : 'Day trip by train') + '</h3><p class="lead">' + (k === 'tokyo' ? 'A fuller day: about two hours each way, but the train is half the fun.' : 'Each leaves early and has you back by mid-afternoon.') + '</p><div class="sights">' + p.daytrips.map(sightCard).join('') + '</div>';
  if (p.extra) html += '<h3>' + esc(p.extraTitle) + '</h3><div class="card">' + esc(p.extra) + '</div>';
  if (p.eat) html += '<h3>Where to eat</h3><div class="card">' + esc(p.eat) + '</div>';
  html += '<h3>Backups for rain or tired days</h3><div class="card"><ul class="plain">' + p.backups.map(function (b) { return '<li><b>' + esc(b[0]) + '.</b> ' + esc(b[1]) + '</li>'; }).join('') + '</ul></div></div>';
  $('#v-places').innerHTML = html;
}
$('#v-places').addEventListener('click', function (e) { var b = e.target.closest('[data-city]'); if (b) go(b.dataset.city); });

/* ---------- Bookings view ---------- */
var bkFilter = 'All';
function renderBookings() {
  var list = state.bookings.slice().sort(function (a, b) { return (a.date || '9999') < (b.date || '9999') ? -1 : (a.date || '9999') > (b.date || '9999') ? 1 : 0; });
  var done = list.filter(function (b) { return b.booked; }).length;
  var html = '<div class="row"><h2>Bookings</h2><span class="spacer"></span><button type="button" class="btn primary" data-act="add">+ Add booking</button></div>';
  html += '<p class="lead">Keep every ticket, confirmation number and booking link here. Dated bookings also appear on that day in the Trip tab.</p>';
  html += '<div class="summary"><div class="card"><b>' + done + ' of ' + list.length + '</b><span class="muted">booked</span></div><div class="card"><b>' + (list.length - done) + '</b><span class="muted">still to book</span></div></div>';
  html += '<div class="filters" role="group" aria-label="Filter">' + ['All', 'To book'].concat(CATS).map(function (f) { return '<button type="button" data-filter="' + esc(f) + '" aria-pressed="' + (f === bkFilter) + '">' + esc(f) + '</button>'; }).join('') + '</div>';
  var shown = list.filter(function (b) { return bkFilter === 'All' || (bkFilter === 'To book' ? !b.booked : b.cat === bkFilter); });
  if (!shown.length) html += '<div class="card muted">Nothing here yet. Use “Add booking” to save one.</div>';
  shown.forEach(function (b) {
    var link = safeUrl(b.link);
    html += '<article class="bk' + (b.booked ? '' : ' todo') + '" id="bk-' + b.id + '"><div class="head"><div style="flex:1"><h4>' + esc(b.title) + '</h4><div class="meta">' + esc(b.cat) + (b.date ? ' · ' + fmtD(b.date) : '') + (b.time ? ' · ' + esc(b.time) : '') + '</div></div>' +
      '<span class="badge ' + (b.booked ? 'ok' : 'todo') + '">' + (b.booked ? 'Booked' : 'To book') + '</span></div>';
    if (b.conf) html += '<div class="conf">Confirmation <b>' + esc(b.conf) + '</b></div>';
    if (b.notes) html += '<div class="notes">' + linkify(b.notes) + '</div>';
    html += '<div class="actions">' + (link ? '<a class="btn small" href="' + esc(link) + '" target="_blank" rel="noopener">Open link</a>' : '') +
      (b.conf ? '<button type="button" class="btn small" data-act="copy" data-id="' + b.id + '">Copy number</button>' : '') +
      '<button type="button" class="btn small" data-act="edit" data-id="' + b.id + '">' + (b.booked || b.conf || b.notes ? 'Edit' : 'Add details') + '</button>' +
      (b.date ? '<button type="button" class="btn small" data-act="day" data-date="' + b.date + '">See day</button>' : '') + '</div></article>';
  });
  html += '<div class="card backup"><h3 style="margin-top:0">Keep a copy</h3><p class="muted" style="margin:0 0 12px">Bookings, ticks and actual spending are saved only in this browser on this device. They are never uploaded with the page. Download a backup to move them to another phone, or to share with your partner.</p>' +
    '<div class="row"><button type="button" class="btn" data-act="export">Download backup</button><button type="button" class="btn" data-act="import">Restore from backup</button></div></div>';
  $('#v-bookings').innerHTML = html;
}
$('#v-bookings').addEventListener('click', function (e) {
  var f = e.target.closest('[data-filter]'); if (f) { bkFilter = f.dataset.filter; renderBookings(); return; }
  var a = e.target.closest('[data-act]'); if (!a) return;
  var act = a.dataset.act;
  if (act === 'add') openDialog(null, '');
  else if (act === 'edit') openDialog(a.dataset.id);
  else if (act === 'day') go('trip', 'day-' + a.dataset.date);
  else if (act === 'copy') { var b = find(a.dataset.id); if (b && navigator.clipboard) navigator.clipboard.writeText(b.conf).then(function () { toast('Copied'); }, function () { toast('Couldn’t copy'); }); }
  else if (act === 'export') exportData();
  else if (act === 'import') $('#importfile').click();
});
function find(id) { for (var i = 0; i < state.bookings.length; i++) if (state.bookings[i].id === id) return state.bookings[i]; return null; }

/* ---------- Dialog ---------- */
var dlg = $('#dlg'), form = $('#bkform'), editing = null;
form.cat.innerHTML = CATS.map(function (c) { return '<option>' + esc(c) + '</option>'; }).join('');
function openDialog(id, date) {
  editing = id ? find(id) : null;
  var b = editing || { cat: 'Other', title: '', date: date || '', time: '', conf: '', link: '', notes: '', booked: true };
  $('#dlg-title').textContent = editing ? 'Edit booking' : 'Add a booking';
  form.title.value = b.title; form.cat.value = b.cat; form.date.value = b.date; form.time.value = b.time;
  form.conf.value = b.conf; form.link.value = b.link; form.notes.value = b.notes; form.booked.checked = editing ? (b.booked || false) : true;
  $('#dlg-del').style.visibility = editing ? 'visible' : 'hidden';
  if (dlg.showModal) dlg.showModal(); else dlg.setAttribute('open', '');
  setTimeout(function () { (editing ? form.conf : form.title).focus(); }, 30);
}
function closeDialog() { if (dlg.close) dlg.close(); else dlg.removeAttribute('open'); }
$('#dlg-cancel').addEventListener('click', closeDialog);
$('#dlg-del').addEventListener('click', function () {
  if (!editing || !confirm('Delete “' + editing.title + '”?')) return;
  state.bookings = state.bookings.filter(function (b) { return b !== editing; });
  save(); closeDialog(); refresh(); toast('Deleted');
});
form.addEventListener('submit', function (e) {
  e.preventDefault();
  var title = form.title.value.trim(); if (!title) { form.title.focus(); return; }
  var link = form.link.value.trim(), notes = form.notes.value;
  if (link && !/^https?:\/\//i.test(link)) link = 'https://' + link;
  if (!link) link = firstUrl(notes);
  var b = editing || { id: uid() };
  b.title = title; b.cat = form.cat.value; b.date = form.date.value; b.time = form.time.value.trim();
  b.conf = form.conf.value.trim(); b.link = link; b.notes = notes; b.booked = form.booked.checked;
  if (!editing) state.bookings.push(b);
  save(); closeDialog(); refresh(); toast('Saved');
});

/* ---------- Backup ---------- */
function exportData() {
  var blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
  var a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'honeymoon-handbook-backup.json';
  document.body.appendChild(a); a.click(); setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 500);
  toast('Backup downloaded');
}
$('#importfile').addEventListener('change', function () {
  var f = this.files[0]; if (!f) return;
  var r = new FileReader();
  r.onload = function () {
    try {
      var s = JSON.parse(r.result);
      if (!s || s.v !== 1 || !Array.isArray(s.bookings)) throw 0;
      if (!confirm('Replace what’s in this browser with the backup?')) return;
      state = { v: 1, seeded: s.seeded, bookings: s.bookings, checks: s.checks || {}, actual: s.actual || {} };
      migrate(); refresh(); toast('Backup restored');
    } catch (e) { toast('That file isn’t a handbook backup'); }
  };
  r.readAsText(f); this.value = '';
});

/* ---------- Checklist ---------- */
function renderChecklist() {
  var total = 0, done = 0, html = '';
  CHECKS.forEach(function (g) { g[1].forEach(function (item) { total++; if (state.checks[checkKey(item)]) done++; }); });
  html += '<h2>Checklist</h2><p class="lead">' + done + ' of ' + total + ' done. Book flights and hotels first; the rest can wait until spring.</p>';
  html += '<div class="progress" aria-hidden="true"><span style="width:' + (100 * done / total) + '%"></span></div>';
  CHECKS.forEach(function (g) {
    var gd = g[1].filter(function (item) { return state.checks[checkKey(item)]; }).length;
    html += '<h3>' + esc(g[0]) + '<span class="group-count">' + gd + ' of ' + g[1].length + '</span></h3><div class="card">';
    g[1].forEach(function (item) { var id = checkKey(item); html += '<label class="check"><input type="checkbox" data-c="' + id + '"' + (state.checks[id] ? ' checked' : '') + '><span>' + esc(item) + '</span></label>'; });
    html += '</div>';
  });
  $('#v-checklist').innerHTML = html;
}
$('#v-checklist').addEventListener('change', function (e) { var c = e.target.dataset.c; if (!c) return; if (e.target.checked) state.checks[c] = true; else delete state.checks[c]; save(); renderChecklist(); });

/* ---------- Budget ---------- */
function renderBudget() {
  var est = 0, act = 0, html = '';
  html += '<h2>Budget</h2><p class="lead">Estimates in CAD for two, at ¥110 = $1. Type what you actually paid as you book, and the totals update.</p>';
  html += '<div class="tbl"><table class="budget"><thead><tr><th>Item</th><th class="num">Estimate</th><th class="num">Actual</th><th class="notes-col">Notes</th></tr></thead><tbody>';
  BUDGET.forEach(function (r) {
    est += r[2]; var a = state.actual[r[0]]; if (a !== undefined && a !== '') act += +a; else act += r[2];
    html += '<tr><td>' + esc(r[1]) + '<div class="bnote">' + esc(r[3]) + '</div></td><td class="num">' + money(r[2]) + '</td><td class="num"><input class="actual" inputmode="decimal" data-b="' + r[0] + '" value="' + (a !== undefined ? esc(a) : '') + '" placeholder="—" aria-label="Actual for ' + esc(r[1]) + '"></td><td class="muted notes-col">' + esc(r[3]) + '</td></tr>';
  });
  html += '</tbody><tfoot><tr><td>Total<div class="bnote" id="actnote-m"></div></td><td class="num">' + money(est) + '</td><td class="num" id="acttotal">' + money(act) + '</td><td class="muted notes-col" id="actnote"></td></tr></tfoot></table></div>';
  html += '<p class="muted" style="margin-top:12px">The actual total counts the estimate for any line you haven’t filled in yet. To trim: shopping first, then Hyatt Regency Seragaki Island instead of Halekulani saves about $2,200.</p>';
  $('#v-budget').innerHTML = html;
  budgetNote(est, act);
}
function budgetNote(est, act) { var d = act - est; $('#actnote').textContent = $('#actnote-m').textContent = d === 0 ? 'On estimate' : (d > 0 ? money(d) + ' over' : money(-d) + ' under'); }
$('#v-budget').addEventListener('input', function (e) {
  var k = e.target.dataset.b; if (!k) return;
  var v = e.target.value.replace(/[^0-9.]/g, ''); if (v === '') delete state.actual[k]; else state.actual[k] = v;
  save();
  var est = 0, act = 0; BUDGET.forEach(function (r) { est += r[2]; var a = state.actual[r[0]]; act += (a !== undefined && a !== '') ? +a : r[2]; });
  $('#acttotal').textContent = money(act); budgetNote(est, act);
});

/* ---------- Info ---------- */
function table(head, rows) {
  return '<div class="tbl stack"><table><thead><tr>' + head.map(function (h) { return '<th>' + esc(h) + '</th>'; }).join('') + '</tr></thead><tbody>' +
    rows.map(function (r) { return '<tr>' + r.map(function (c, i) { return '<td data-label="' + esc(head[i]) + '">' + esc(c) + '</td>'; }).join('') + '</tr>'; }).join('') + '</tbody></table></div>';
}
function renderInfo() {
  var html = '<h2>Good to know</h2><p class="lead">Transport, backup hotels, weather and etiquette in one place.</p>';
  html += '<div class="info-block"><h3>Getting around</h3><p class="muted">Skip the JR Pass: it costs ¥50,000 each, and your only long ride, Tokyo to Kyoto, is about ¥14,500. Load a Suica card into your phone’s wallet for trains, buses and shops.</p>' +
    table(['Leg', 'How', 'Time', 'Cost for two (CAD)'], [
      ['Toronto → Tokyo Haneda', 'Air Canada or ANA nonstop', '13–14 hours', 'Part of $3,800 return'],
      ['Haneda → Asakusa', 'Keikyu / Asakusa line, or taxi', '40 minutes', '$20 train, about $100 taxi'],
      ['Asakusa ⇄ Nikko', 'Tobu Spacia X', 'About 1h50 each way', 'About 120'],
      ['Tokyo → Kyoto', 'Shinkansen (Nozomi), reserved', '2h15', '270 (370 Green Car)'],
      ['Kyoto → Uji', 'JR Nara line', '20–30 minutes', '10'],
      ['Arashiyama gorge', 'Sagano train up, river boat down', '25 min + 2 hours', 'About 140'],
      ['Kyoto ⇄ Himeji (optional)', 'Shinkansen', 'About 50 min each way', 'About 180'],
      ['Kyoto ⇄ Nara', 'Kintetsu or Aoniyoshi', '45 min each way', '25–40'],
      ['Kyoto → Itami airport', 'Airport limousine bus', 'About 55 minutes', '30'],
      ['Itami → Naha', 'ANA or JAL', 'About 2 hours', 'Part of $700'],
      ['Okinawa', 'Rental car from Naha airport', 'Naha to Onna 1 hour', '340 for 4 days'],
      ['Naha → Tokyo → Toronto', 'Domestic flight, then connect', 'Same-day arrival', 'Part of flights']
    ]) + '<p class="muted" style="margin-top:10px">Book Toronto → Tokyo and Naha → Tokyo → Toronto as one multi-city ticket, so a missed connection is the airline’s problem.</p></div>';
  html += '<div class="info-block"><h3>Backup hotels</h3><p class="muted">If a main pick is sold out or overpriced. Approximate late-June rates for two.</p>' +
    table(['City', 'Hotel', 'Per night (CAD)', 'Why'], [
      ['Tokyo', 'Imperial Hotel', '550–1,000', 'Historic grand hotel beside the Imperial Palace gardens'],
      ['Tokyo', 'Hoshinoya Tokyo', '1,100–1,600', 'A modern ryokan with a rooftop hot-spring bath'],
      ['Kyoto', 'Ace Hotel Kyoto', '400–550', 'Design hotel in a 1920s telephone exchange, central'],
      ['Kyoto', 'Hotel The Mitsui Kyoto', '1,200–1,800', 'A 300-year-old gate, garden and thermal spa by Nijō Castle'],
      ['Okinawa', 'Hyatt Regency Seragaki Island', '365–545', 'Its own small island and lagoon, near Halekulani'],
      ['Okinawa', 'The Busena Terrace', '500–800', 'Classic beach resort on its own peninsula'],
      ['Okinawa', 'Hoshinoya Okinawa', '1,100+', 'Very private, ryokan-style, every room faces the sea']
    ]) + '<p class="muted" style="margin-top:10px">Kyoto’s hotel tax is per person: ¥1,000 at most mid-range rates, ¥4,000 from ¥50,000 per person, ¥10,000 from ¥100,000 per person.</p></div>';
  html += '<div class="info-block"><h3>Weather</h3>' + table(['Place', 'Late June', 'What it means'], [
    ['Tokyo and Kyoto', 'About 28–30°C, humid, rainy-season showers until mid-July', 'Go out mornings and evenings; carry an umbrella'],
    ['Okinawa', 'About 31°C, sea about 28°C; rainy season usually ends around June 21', 'Typhoon risk is low to moderate in June, rising in July']
  ]) + '</div>';
  html += '<div class="info-block tips"><h3>Etiquette and money</h3><div class="card">' +
    '<p><b>Money.</b> Cards work almost everywhere, but shrines, food stalls and some taxis want cash. Carry your passport when shopping for the tax refund.</p>' +
    '<p><b>Manners.</b> No tipping. Keep quiet on trains. Take shoes off where you see a step up or slippers.</p>' +
    '<p><b>Heat.</b> Drink water constantly. Plan a hotel break between noon and 3pm in Kyoto.</p>' +
    '<p style="margin:0"><b>Luggage.</b> Send big suitcases ahead from the hotel front desk (takkyubin, about ¥2,000–3,000 a bag, next-day delivery) and ride trains with day bags. On the Tokyo–Kyoto shinkansen, bags over 160 cm in total dimensions need a reserved oversized-luggage seat.</p></div></div>';
  html += '<div class="info-block"><h3>Sources</h3><p class="muted">Prices checked November 2026; book-time prices will differ.</p><div class="card"><ul class="plain">' + [
    ['Japan Rail Pass prices', 'https://www.getaroundjapan.jp/?p=10991'],
    ['Kyoto accommodation tax', 'https://okinawa.stripes.com/travel/kyoto-hotel-tax.html1'],
    ['Tokyo luxury hotel rates', 'https://www.tokyotourism.org/tokyo-luxury-hotels/'],
    ['Okinawa rainy season', 'https://english.ryukyushimpo.jp/2021/07/06/33835/'],
    ['Okinawa typhoon season', 'https://japanuncharted.com/okinawa/weather/typhoon-season-okinawa-travel'],
    ['Shuri Castle reopening', 'https://goasia.cc/en/news/okinawa-shuri-castle-main-hall-reopens-november-2026'],
    ['Shuri Castle tickets', 'https://visitokinawajapan.com/?p=18945'],
    ['Himeji Castle fee', 'https://www.japantimes.co.jp/news/2025/02/16/japan/himeji-castle-fee-rise'],
    ['Spacia X fares', 'https://ekitan.com/en/article/spacia-x'],
    ['Sagano Romantic Train, new train from 2027', 'https://selfguidejapan.com/blog/sagano-romantic-train'],
    ['Sagano Romantic Train closures', 'https://www.kyotostation.com/the-sagano-romantic-train/']
  ].map(function (s) { return '<li><a href="' + s[1] + '" target="_blank" rel="noopener">' + esc(s[0]) + '</a></li>'; }).join('') + '</ul></div></div>';
  $('#v-info').innerHTML = html;
}

/* ---------- Boot ---------- */
function refresh() { renderTrip(); renderBookings(); renderChecklist(); renderBudget(); }
renderCountdown(); refresh(); renderInfo(); renderPlaces();
show(location.hash.slice(1) || 'trip');
})();
</script>
